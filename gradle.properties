# JVM 参数：按项目规模给 3G 堆，Kotlin 编译 + Compose 编译插件需要足够内存
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8

# 关键：本机 Windows 用户名为中文（C:\Users\俞皓文），Kotlin 编译守护进程在跨进程
# 传递 Compose 编译插件 jar 路径时会把中文转义为 uXXXX 形式导致路径失效
# （报错形如 plugin classpath entry points to a non-existent location）。
# 改为进程内编译，不再跨进程传参，彻底规避该问题。
kotlin.compiler.execution.strategy=in-process

# AndroidX（必须开启，项目全程使用 AndroidX）
android.useAndroidX=true

# 非传递 R 类：加快编译、减小方法数
android.nonTransitiveRClass=true

# 构建缓存与并行，首启后二次构建明显更快
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=false

kotlin.code.style=official

# Gradle 的 Kotlin DSL 为了给 .gradle.kts 脚本做补全，会去拉 gradle-8.7-src.zip，
# 这个地址在 Gradle 8.7 里是硬编码的 https://services.gradle.org/distributions
# （SourceDistributionProvider.kt:98），且 302 到 GitHub Releases，国内必然连接
# 超时。该异常在 Gradle 侧只是 WARN、不影响构建，但默认连接超时 30s × 3 次重试
# 会让每次 Sync 白等 1~2 分钟，这里把连接超时压到 10s。
# 彻底消除该请求的做法见 gradle/wrapper/gradle-wrapper.properties 的说明。
systemProp.org.gradle.internal.http.connectionTimeout=10000

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Use Tencent Cloud mirror instead of services.gradle.org.
# The official host needs ~7s to first byte from CN networks and trips the
# 10s read timeout (SocketTimeoutException: Read timed out); the mirror
# responds in ~380ms. Same artifact (128.0 MB), sha-identical.
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.7-bin.zip
# Raised from 10s to 60s so a brief network hiccup cannot abort a 128MB download
networkTimeout=60000
# 注意：Android Studio 索引 Gradle API 时会另外下载 gradle-8.7-src.zip，该请求
# 由 IDE 硬编码为 https://services.gradle.org/distributions/（实测见 idea.log，
# 它不读取 distributionUrl），因此换镜像管不住它。现改为复用本地 gradle-8.7-all
# 分发自带的源码目录（junction 到本分发的 gradle-8.7/src），IDE 检测到源码目录
# 已存在即跳过下载。日后升级 Gradle 版本时需对新版本重复该处理。
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
